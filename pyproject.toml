[project]
name = "plasma-limits"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "juliacall>=0.9.36",
    "juliapkg>=0.1.27",
    "matplotlib>=3.10.9",
    "netcdf4>=1.7.4",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scipy>=1.17.1",
]


[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers -m 'not slow and not integration'"
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs with real EPED1 (starts Julia)",
    "cluster: needs Firedrake",
    "integration: ARC run of ESCAPE (1D scipy, real EPED1) against tests/data/arc_1d_baseline.npy",
]
